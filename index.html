<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caption Generator Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg"></div>

  <div class="app">

    <h1>Caption Generator Pro</h1>
    <p class="subtitle">AI-powered viral captions for Instagram & Facebook</p>

    <!-- TYPE -->
    <div class="section">
      <label>Video Type</label>
      <select id="type">
        <option value="dancing">Dancing</option>
        <option value="cosplay">Cosplay</option>
        <option value="goth">Goth</option>
        <option value="plus size">Plus Size</option>
        <option value="normal girl">Normal Girl</option>
      </select>
    </div>

    <!-- PLATFORM TABS -->
    <div class="section">
      <label>Platform Mode</label>
      <div class="chips">
        <button id="tab-ig" class="active" onclick="setPlatform('instagram')">
          📸 Instagram
        </button>
        <button id="tab-fb" onclick="setPlatform('facebook')">
          📘 Facebook
        </button>
      </div>
      <input type="hidden" id="platform" value="instagram">
    </div>

    <!-- TONE -->
    <div class="section">
      <label>Tone</label>
      <div class="chips">
        <button onclick="setTone('comment bait', event)">🔥 Comment Bait</button>
        <button onclick="setTone('flirty', event)">😏 Flirty</button>
        <button onclick="setTone('funny', event)">😂 Funny</button>
        <button onclick="setTone('mysterious', event)">🖤 Mysterious</button>
        <button onclick="setTone('confident', event)">💪 Confident</button>
        <button onclick="setTone('playful', event)">😊 Playful</button>
        <button onclick="setTone('bratty', event)">😈 Bratty</button>
      </div>
      <input type="hidden" id="tone" value="comment bait">
    </div>

    <!-- COUNT -->
    <div class="section">
      <label>Number of Captions</label>
      <select id="count">
        <option value="10">10 captions</option>
        <option value="25">25 captions</option>
        <option value="50" selected>50 captions</option>
      </select>
    </div>

    <!-- TOGGLES (NEW FEATURES) -->
    <div class="section">
      <label>Advanced Mode</label>

      <div class="chips">
        <button id="bestModeBtn" onclick="toggleBestMode()">
          🔥 Best Captions Only
        </button>

        <button id="scoreModeBtn" onclick="toggleScoreMode()">
          📊 Engagement Score
        </button>
      </div>

      <input type="hidden" id="bestMode" value="false">
      <input type="hidden" id="scoreMode" value="false">
    </div>

    <!-- BUTTON -->
    <button class="generate" onclick="generateCaptions()">
      Generate Captions ✨
    </button>

    <!-- SPLIT OUTPUT (NEW STRUCTURE) -->
    <div class="split-container">

      <div class="panel ig-panel">
        <h2>📸 Instagram</h2>
        <div id="ig-output"></div>
      </div>

      <div class="panel fb-panel">
        <h2>📘 Facebook</h2>
        <div id="fb-output"></div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
